<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #101310;
        color: #eeefeb;
        font-family: "Inter", sans-serif;
        padding: 65px 75px;
        position: relative;
        overflow: hidden;
      }
      .mark {
        font-size: 42px;
        font-weight: bold;
        letter-spacing: -4px;
      }
      .green {
        color: #b9f77a;
      }
      .label {
        font-size: 15px;
        letter-spacing: 3px;
        color: #b9f77a;
        margin-top: 54px;
      }
      h1 {
        font-size: 89px;
        letter-spacing: -5px;
        line-height: 1.05;
        font-weight: 500;
        margin: 25px 0;
      }
      .sub {
        font-size: 24px;
        color: #a0a79e;
      }
      .line {
        position: absolute;
        bottom: 52px;
        left: 75px;
        right: 75px;
        border-top: 1px solid #343d2e;
        padding-top: 20px;
        color: #a0a79e;
        font-size: 14px;
      }
      .art {
        position: absolute;
        width: 500px;
        height: 500px;
        border: 1px solid #b9f77a33;
        border-radius: 50%;
        top: 55px;
        right: -100px;
      }
      .art:after {
        content: "";
        position: absolute;
        inset: 55px;
        border: 1px solid #b9f77a33;
        border-radius: 50%;
      }
      .code {
        position: absolute;
        right: 100px;
        top: 240px;
        font-size: 85px;
        color: #b9f77a;
        letter-spacing: 10px;
      }
    </style>
  </head>
  <body>
    <div class="mark">kv<span class="green">.</span></div>
    <div class="label">SOFTWARE ENGINEER · NETHERLANDS</div>
    <h1>Kamyab<br />Valipour<span class="green">.</span></h1>
    <div class="sub">Engineering ideas. Building what’s next.</div>
    <div class="art"></div>
    <div class="code">&lt;/&gt;</div>
    <div class="line">
      .NET &nbsp; / &nbsp; AI &nbsp; / &nbsp; FULL-STACK &nbsp; / &nbsp; DEVOPS
    </div>
  </body>
</html>
